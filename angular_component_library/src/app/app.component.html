<ocean-toolbar>
  <span start><strong>Company</strong></span>
  <div end style="display:flex;align-items:center;gap:12px;">
    <span style="font-size:14px;color:var(--ocean-text)">John.doe</span>
    <span style="font-size:12px;color:var(--ocean-secondary)">Super user</span>
  </div>
</ocean-toolbar>

<div style="display:flex; min-height: calc(100vh - 64px);">
  <ocean-sidebar style="min-height: calc(100vh - 64px);" [logoText]="'Company'" [items]="sidebarItems"></ocean-sidebar>
  <div style="flex:1; padding:16px; display:flex; flex-direction:column; gap:16px;">
    <div style="display:flex; gap:16px;">
      <ocean-select [label]="'All Properties'" [options]="propsA"></ocean-select>
      <ocean-select [label]="'All Partners'" [options]="propsB"></ocean-select>
      <ocean-input [label]="'Search for'"></ocean-input>
      <ocean-button color="primary">Add Profile</ocean-button>
    </div>
    <ocean-tabs [tabs]="tabs" [selectedIndex]="0"></ocean-tabs>
    <ocean-table [columns]="columns" [rows]="rows"></ocean-table>
  </div>
</div>
